# Local dev only. Prod uses managed Postgres + Redis.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: avantra
      POSTGRES_PASSWORD: avantra
      POSTGRES_DB: avantra
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
